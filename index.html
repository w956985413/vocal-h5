<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>声乐试听课课时规划器</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; background: #f5f5f7; color: #2b2b3a;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", Helvetica, sans-serif;
    padding-bottom: 90px;
  }
  .topbar {
    position: sticky; top: 0; z-index: 10; background: #2b2b3a; color: #fff;
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 16px;
  }
  .topbar .t { font-size: 17px; font-weight: 700; }
  .topbar .his { font-size: 13px; color: #aab6ff; }
  .wrap { padding: 12px; }
  .stepbar { background: #fff; border-radius: 12px; padding: 12px 14px; margin-bottom: 12px; font-size: 13px; color: #666; }
  .stepbar .sbt { margin-bottom: 8px; } .stepbar b { color: #4a6cf7; }
  .bar { height: 8px; background: #eee; border-radius: 8px; overflow: hidden; }
  .bar > i { display: block; height: 100%; background: linear-gradient(90deg,#6a8dff,#4a6cf7); border-radius: 8px; transition: width .25s; }

  .scriptlabel { font-size: 12px; color: #c79a3a; font-weight: 700; margin: 2px 0 6px; }
  .script { background: #fff8e9; border: 1px solid #f0e0b8; border-left: 4px solid #e0b24a; border-radius: 10px; padding: 10px 12px; margin-bottom: 8px; font-size: 14px; line-height: 1.65; color: #5b4a2a; }
  .practice { background: #eef4ff; border-radius: 10px; padding: 10px 12px; margin-bottom: 12px; }
  .practice .glabel { font-size: 13px; font-weight: 700; color: #33415e; margin-bottom: 6px; }
  .phint { font-size: 13px; color: #33415e; line-height: 1.65; }
  .other-input { width: 100%; box-sizing: border-box; margin-top: 8px; padding: 9px 10px; border: 1px solid #ddd; border-radius: 9px; font-size: 14px; }

  .card { background: #fff; border-radius: 14px; padding: 14px; margin-bottom: 12px; box-shadow: 0 2px 8px rgba(0,0,0,.04); }
  .qhead { display: flex; align-items: center; margin-bottom: 10px; }
  .qno { width: 24px; height: 24px; line-height: 24px; text-align: center; background: #2b2b3a; color: #fff; border-radius: 50%; font-size: 13px; margin-right: 8px; flex: none; }
  .qtitle { font-size: 15px; font-weight: 600; flex: 1; }
  .qtag { font-size: 11px; color: #999; border: 1px solid #ddd; border-radius: 6px; padding: 1px 7px; flex: none; margin-left: 6px; }
  .opts { display: flex; flex-wrap: wrap; }
  .opt {
    font-size: 14px; color: #444; background: #f4f5f8; border: 1.5px solid #f4f5f8;
    border-radius: 9px; padding: 9px 12px; margin: 0 8px 8px 0; line-height: 1.3; cursor: pointer;
  }
  .opt.on { background: #eaf0ff; border-color: #4a6cf7; color: #2b4bb0; font-weight: 600; }
  .opt.dis { opacity: .4; }
  .hint { font-size: 11px; color: #c08a3e; margin-top: 2px; }
  .footer {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
    display: flex; gap: 10px; padding: 10px 12px; background: #fff;
    box-shadow: 0 -2px 8px rgba(0,0,0,.06);
  }
  .footer button {
    flex: 1; font-size: 15px; border: none; border-radius: 10px; padding: 12px 0; font-weight: 600;
  }
  .btn-reset { background: #f1f1f4; color: #555; width: 84px; flex: none; }
  .btn-prev { background: #f1f1f4; color: #555; width: 84px; flex: none; }
  .btn-gen { background: #c7cbd6; color: #fff; }
  .btn-gen.on { background: linear-gradient(90deg,#5a7bff,#4a6cf7); }

  /* 报告 */
  #report { display: none; padding: 12px; }
  .badge { display: inline-block; background: #eaf0ff; color: #2b4bb0; font-size: 13px; padding: 6px 14px; border-radius: 20px; margin-bottom: 10px; }
  .badge b { font-size: 15px; }
  .badge .tip { color: #c08a3e; font-size: 11px; margin-left: 5px; }
  .report { background: #fff; border-radius: 14px; padding: 18px 16px; box-shadow: 0 2px 8px rgba(0,0,0,.04); }
  .sp { height: 9px; }
  .title { font-size: 20px; font-weight: 700; text-align: center; margin: 4px 0 10px; }
  .h2 { font-size: 17px; font-weight: 700; margin: 16px 0 6px; }
  .h3 { font-size: 15px; font-weight: 700; color: #2b4bb0; margin: 12px 0 4px; }
  .glabel { font-size: 14px; font-weight: 700; color: #4a6cf7; margin: 9px 0 3px; }
  .group-title { font-size: 12px; font-weight: 700; color: #8a6d3b; background: #fbf3e3; border-left: 3px solid #e0b15a; padding: 6px 10px; margin: 14px 0 8px; border-radius: 6px; }
  .bullet { font-size: 14px; color: #333; line-height: 1.55; display: flex; }
  .bullet .d { color: #4a6cf7; margin-right: 6px; flex: none; }
  .bullet .x { flex: 1; }
  .sub { font-size: 13px; color: #666; line-height: 1.55; padding-left: 22px; }
  .check { font-size: 14px; color: #2e7d32; font-weight: 600; line-height: 1.55; margin: 4px 0; }
  .warn { font-size: 14px; color: #c0392b; font-weight: 600; line-height: 1.55; margin: 7px 0; }
  .txt { font-size: 14px; color: #333; line-height: 1.55; }
  .rfoot { position: fixed; left:0; right:0; bottom:0; z-index:20; display:flex; gap:8px; padding:10px 12px; background:#fff; box-shadow:0 -2px 8px rgba(0,0,0,.06); }
  .rfoot button { flex:1; font-size:13px; border:none; border-radius:10px; padding:11px 0; font-weight:600; }
  .rfoot .g { background:#f1f1f4; color:#444; }
  .rfoot .p { background:linear-gradient(90deg,#5a7bff,#4a6cf7); color:#fff; }

  /* 弹层 */
  .mask { position: fixed; inset: 0; background: rgba(0,0,0,.6); z-index: 50; display: none; align-items: center; justify-content: center; padding: 16px; }
  .mask.show { display: flex; }
  .sheet { background: #fff; border-radius: 14px; width: 100%; max-width: 380px; max-height: 84vh; overflow: auto; padding: 14px; }
  .sheet h3 { margin: 0 0 10px; font-size: 16px; }
  .sheet img { width: 100%; border-radius: 8px; }
  .sheet .ph { font-size: 12px; color: #999; text-align: center; margin: 8px 0; }
  .sheet .close { margin-top: 8px; width: 100%; border: none; background: #f1f1f4; color: #444; border-radius: 10px; padding: 11px 0; font-size: 14px; }
  .hist-item { border-bottom: 1px solid #f0f0f0; padding: 11px 4px; display: flex; align-items: center; justify-content: space-between; }
  .hist-item .l .d { font-size: 14px; font-weight: 600; }
  .hist-item .l .t { font-size: 11px; color: #999; margin-top: 3px; }
  .hist-item .r { font-size: 12px; color: #4a6cf7; }
  .toast { position: fixed; left: 50%; top: 38%; transform: translateX(-50%); background: rgba(0,0,0,.8); color: #fff; padding: 10px 18px; border-radius: 8px; font-size: 14px; z-index: 99; display: none; max-width: 80%; text-align: center; }

  /* AI 设置 */
  .ai { font-size: 13px; color: #aab6ff; margin-left: 10px; }
  .set-row { margin: 12px 0; }
  .set-row label { display: block; font-size: 13px; color: #555; margin-bottom: 5px; }
  .set-row input, .set-row select { width: 100%; box-sizing: border-box; font-size: 14px; padding: 9px 10px; border: 1px solid #ddd; border-radius: 9px; background: #fafbff; }
  .set-row .hint2 { font-size: 11px; color: #999; margin-top: 4px; line-height: 1.5; }
  .set-toggle { display: flex; align-items: center; justify-content: space-between; margin: 12px 0 2px; }
  .set-toggle .lbl { font-size: 14px; font-weight: 600; }
  .switch { position: relative; display: inline-block; width: 46px; height: 26px; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .slider { position: absolute; cursor: pointer; inset: 0; background: #ccc; border-radius: 26px; transition: .2s; }
  .slider:before { content: ''; position: absolute; height: 20px; width: 20px; left: 3px; top: 3px; background: #fff; border-radius: 50%; transition: .2s; }
  .switch input:checked + .slider { background: #4a6cf7; }
  .switch input:checked + .slider:before { transform: translateX(20px); }
</style>
</head>
<body>

<div class="topbar">
  <div class="t">声乐试听课课时规划器</div>
  <div style="display:flex; align-items:center;">
    <div class="ai" id="aiBtn">AI</div>
    <div class="his" id="histBtn">历史</div>
  </div>
</div>

<div id="formView">
  <div class="wrap">
    <div class="stepbar">
      第 <b id="stepNo">1</b> / 5 步 · <span id="stepName">破冰与需求收集</span>
      <div class="bar"><i id="stepFill" style="width:20%"></i></div>
    </div>
    <div class="scriptlabel" id="scriptLabel">本步话术（念给学生听）</div>
    <div id="scriptBox"></div>
    <div class="practice" id="practiceBox" style="display:none"></div>
    <div id="questions"></div>
  </div>
  <div class="footer">
    <button class="btn-reset" id="resetBtn">重置</button>
    <button class="btn-prev" id="prevBtn" style="visibility:hidden;">上一步</button>
    <button class="btn-gen" id="nextBtn">下一步</button>
  </div>
</div>

<div id="report">
  <div class="badge">总课时 <b id="pkg">—</b><span class="tip" id="pkgTip"></span></div>
  <div class="report" id="reportBody"></div>
  <div class="rfoot">
    <button class="g" id="redoBtn">重新评估</button>
    <button class="g" id="copyBtn">复制文本</button>
    <button class="g" id="imgBtn">生成图片</button>
    <button class="p" id="shareBtn">转发</button>
  </div>
</div>

<div class="mask" id="imgMask">
  <div class="sheet">
    <h3>学习计划（长图）</h3>
    <img id="imgEl" alt="report" />
    <div class="ph">手机端：长按上方图片即可保存 / 转发；电脑端：点下方按钮下载</div>
    <button class="close" id="imgDown">下载图片</button>
    <button class="close" id="imgClose" style="background:#f1f1f4;">关闭</button>
  </div>
</div>

<div class="mask" id="histMask">
  <div class="sheet">
    <h3>历史方案</h3>
    <div id="histList"></div>
    <button class="close" id="histClose">关闭</button>
  </div>
</div>

<div class="mask" id="aiMask">
  <div class="sheet">
    <h3>AI 增强设置</h3>
    <div class="set-toggle">
      <span class="lbl">启用 AI 增强</span>
      <label class="switch"><input type="checkbox" id="aiEnabled" /><span class="slider"></span></label>
    </div>
    <div class="set-row">
      <label>服务商（预设接口地址）</label>
      <select id="aiProvider">
        <option value="siliconflow">硅基流动 SiliconFlow（国内，注册送 14 元代金券）</option>
        <option value="openrouter">OpenRouter（免费模型多，国内偶尔不稳）</option>
        <option value="deepseek">DeepSeek</option>
        <option value="openai">OpenAI</option>
        <option value="custom">自定义</option>
      </select>
    </div>
    <div class="set-row">
      <label>API Key</label>
      <input type="password" id="aiKey" placeholder="粘贴你的密钥，仅保存在本机浏览器" autocomplete="off" />
    </div>
    <div class="set-row">
      <label>模型名</label>
      <input type="text" id="aiModel" placeholder="如 deepseek-ai/DeepSeek-V3" autocomplete="off" />
    </div>
    <div class="set-row">
      <label>接口地址（自定义时填写）</label>
      <input type="text" id="aiBase" placeholder="https://.../v1" autocomplete="off" />
    </div>
    <div class="hint2 set-row">开启后，生成方案会调用大模型给出更贴合学生情况的个性化表述，并以规则引擎为保底。浏览器直连可能受跨域限制；若调用失败（多为跨域或密钥问题），会自动退回规则模式，不影响使用。密钥仅存于本机浏览器 localStorage，不会上传到任何第三方。</div>
    <button class="close" id="aiSave" style="background:linear-gradient(90deg,#5a7bff,#4a6cf7); color:#fff;">保存</button>
    <button class="close" id="aiClose" style="background:#f1f1f4;">关闭</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ====================== 数据 ======================
const QUESTIONS = [
  { id:'Q1', step:1, title:'最想解决的核心问题', type:'single', options:[
    {key:'A',text:'高音上不去/挤卡'},{key:'B',text:'气息不够/唱歌累'},{key:'C',text:'跑调/音准不好'},
    {key:'D',text:'声音虚/没穿透力'},{key:'E',text:'唱歌没感情/平淡'},{key:'F',text:'想学技巧但不知道怎么练'},
    {key:'G',text:'其他：______'} ] },
  { id:'Q2', step:2, title:'学生年龄段', type:'single', options:[
    {key:'A',text:'儿童（12岁以下）'},{key:'B',text:'青少年（13-17岁）'},{key:'C',text:'青年（18-35岁）'},
    {key:'D',text:'中年（36-55岁）'},{key:'E',text:'中老年（56岁以上）'} ] },
  { id:'Q2_1', step:2, title:'变声期状态', type:'single', cond:{q:'Q2',is:'B'}, options:[
    {key:'A',text:'变声期初期（声音开始不稳定）'},{key:'B',text:'变声期中期（声音变化明显，音域受限）'},
    {key:'C',text:'变声期后期（声音逐渐稳定）'},{key:'D',text:'已过变声期'},{key:'E',text:'不确定，需要进一步观察'} ] },
  { id:'Q3', step:2, title:'学生基础情况', type:'single', options:[
    {key:'A',text:'零基础，完全没学过'},{key:'B',text:'自学过一些，没有系统训练'},
    {key:'C',text:'跟老师系统学过1年以内'},{key:'D',text:'跟老师系统学过1年以上'},{key:'E',text:'有专业背景'} ] },
  { id:'Q4', step:2, title:'学习方向', type:'single', options:[
    {key:'A',text:'流行演唱'},{key:'B',text:'美声演唱'},{key:'C',text:'民族演唱'} ] },
  { id:'Q5', step:2, title:'气息', type:'multi', exclusiveKey:'A', options:[
    {key:'A',text:'无明显问题'},{key:'B',text:'吸气浅（锁骨呼吸，肩膀上提）'},
    {key:'C',text:'气息支撑不稳（句尾发虚、声音发抖）'},{key:'D',text:'气息与发声连接不畅（声音与气息脱节）'} ] },
  { id:'Q6', step:2, title:'发声位置', type:'multi', exclusiveKey:'A', options:[
    {key:'A',text:'无明显问题'},{key:'B',text:'发声位置靠前（声音偏白、扁）'},
    {key:'C',text:'发声位置靠后（声音闷、暗）'},{key:'D',text:'喉位不稳定（高音时喉头上提）'} ] },
  { id:'Q7', step:2, title:'换声区', type:'multi', exclusiveKey:'A', options:[
    {key:'A',text:'无明显问题'},{key:'B',text:'换声点有明显断层（真声假声切换时“裂开”）'},
    {key:'C',text:'高音挤卡（用喉咙硬“够”）'},{key:'D',text:'换声区音色不统一'} ] },
  { id:'Q8', step:2, title:'音准', type:'single', options:[
    {key:'A',text:'音准良好，无明显问题'},{key:'B',text:'偶有偏差（大跳或变化音不够准）'},
    {key:'C',text:'整体音准偏差'} ] },
  { id:'Q9', step:2, title:'节奏', type:'single', options:[
    {key:'A',text:'节奏感良好'},{key:'B',text:'偶有抢拍或拖拍'},
    {key:'C',text:'整体节奏不稳定'} ] },
  { id:'Q10', step:2, title:'咬字', type:'multi', exclusiveKey:'A', options:[
    {key:'A',text:'咬字清晰自然'},{key:'B',text:'元音不纯或变形'},
    {key:'C',text:'辅音含糊'} ] },
  { id:'Q11', step:2, title:'整体表现力', type:'single', options:[
    {key:'A',text:'有基本情感表达'},{key:'B',text:'演唱平淡，缺乏起伏'},
    {key:'C',text:'有明显舞台张力优势'} ] },
  { id:'Q12', step:2, title:'面部与肢体紧张度', type:'single', options:[
    {key:'A',text:'整体松弛，无明显紧张'},{key:'B',text:'耸肩（吸气时肩膀上提）'},
    {key:'C',text:'颈部僵硬/前伸'},{key:'D',text:'面部紧张（咬牙、皱眉）'},{key:'E',text:'以上多项存在'} ] },
  { id:'Q13', step:2, title:'听力与模仿能力', type:'single', options:[
    {key:'A',text:'能准确模仿音高和节奏'},{key:'B',text:'能模仿但偶有偏差'},
    {key:'C',text:'模仿有明显困难'} ] },
  { id:'Q14', step:2, title:'过往表演经验', type:'single', options:[
    {key:'A',text:'有丰富舞台/比赛/演出经验'},{key:'B',text:'偶尔有表演经历'},
    {key:'C',text:'从未登台表演过'},{key:'D',text:'有过不愉快的表演经历，心态需要调整'} ] },
  { id:'Q15', step:4, title:'学习目标', type:'single', options:[
    {key:'A',text:'兴趣爱好，能唱喜欢的歌就行'},{key:'B',text:'短期有表演需求（年会/婚礼/聚会）'},
    {key:'C',text:'系统提升，长期进步'},{key:'D',text:'专业方向（艺考/音乐院校）'} ] },
  { id:'Q16', step:4, title:'每周可上课次数', type:'single', options:[
    {key:'A',text:'每周1节'},{key:'B',text:'每周2节'},{key:'C',text:'每周3节或以上'},
    {key:'D',text:'不确定，需要老师建议'} ] },
  { id:'Q17', step:4, title:'课后可练习时间', type:'single', options:[
    {key:'A',text:'有，每天可练15-20分钟'},{key:'B',text:'有，每周可练2-3次'},
    {key:'C',text:'基本没有'} ] },
  { id:'Q19', step:4, title:'单节课时长', type:'single', options:[
    {key:'A',text:'45分钟'},{key:'B',text:'60分钟（1小时）'} ] },
  { id:'Q18', step:5, title:'歌曲风格偏好', type:'multi', options:[
    {key:'A',text:'经典老歌/华语流行'},{key:'B',text:'当代流行/抒情'},{key:'C',text:'民谣'},
    {key:'D',text:'R&B/Soul'},{key:'E',text:'音乐剧'},{key:'F',text:'不确定/让老师推荐'} ] }
];

// 推荐曲目库（可按需修改）
const SONGS = {
  A: { entry:['月亮代表我的心','甜蜜蜜'], adv:['我只在乎你','小城故事'] },
  B: { entry:['后来','晴天'], adv:['修炼爱情','说散就散'] },
  C: { entry:['成都','南山南'], adv:['理想','斑马斑马'] },
  D: { entry:['简单爱','龙卷风'], adv:['安静','枫'] },
  E: { entry:['Memory','Do-Re-Mi（中文版）'], adv:['想着我（歌剧魅影选段）','回忆（音乐剧版）'] },
  F: { entry:['月亮代表我的心','后来'], adv:['成都','我只在乎你'] }
};

// ====================== 工具函数 ======================
function getOptionText(qid,key){ const q=QUESTIONS.find(x=>x.id===qid); if(!q) return ''; const o=q.options.find(op=>op.key===key); return o?o.text:''; }
function selTexts(qid,sel){
  const q=QUESTIONS.find(x=>x.id===qid); if(!q) return '—';
  if(Array.isArray(sel)){ if(!sel||sel.length===0) return '无明显问题'; return sel.map(k=>getOptionText(qid,k)).filter(Boolean).join('、'); }
  return sel ? getOptionText(qid,sel) : '—';
}
function inArr(v,keys){ return keys.indexOf(v)>=0; }
function cleanArr(arr){ const a=Array.isArray(arr)?arr:[arr]; return a.filter(x=>x!=='A'); }
function noProb(arr){ return cleanArr(arr).length===0; }
function hasProb(arr,keys){ const a=Array.isArray(arr)?arr:[arr]; return a.some(x=>keys.indexOf(x)>=0); }
function issueIn(arr,keys){ const a=Array.isArray(arr)?arr:[arr]; return a.some(x=>keys.indexOf(x)>=0); }

// ====================== 话术辅助 ======================
function coreProblem(a){
  if(a.Q1==='G') return (a.Q1_other && a.Q1_other.trim()) ? a.Q1_other.trim() : '你最想解决的那件事';
  return getOptionText('Q1', a.Q1) || '你最想解决的核心问题';
}
function coreCat(a){
  const m={A:'换声区与发声',B:'气息',C:'音准',D:'发声位置与共鸣',E:'表现力',F:'基本功'};
  if(a.Q1!=='G') return m[a.Q1]||'基本功';
  if(issueIn(a.Q7,['B','C','D'])) return '换声区';
  if(issueIn(a.Q5,['B','C','D'])) return '气息';

function determinePackage(a){
  const Q3=a.Q3,Q4=a.Q4,Q5=a.Q5||[],Q7=a.Q7||[],Q8=a.Q8,Q9=a.Q9,Q10=a.Q10||[],Q11=a.Q11,Q15=a.Q15,Q16=a.Q16,Q17=a.Q17;
  const no5=noProb(Q5), no7=noProb(Q7);
  const iss5bc=hasProb(Q5,['B','C']), iss7bc=hasProb(Q7,['B','C']), iss7bcd=hasProb(Q7,['B','C','D']);
  // 5节
  if(Q15==='A' && inArr(Q3,['C','D']) && no5 && no7 && Q16==='A' && Q17==='A' && Q11==='C') return 5;
  if(Q15==='A' && inArr(Q3,['C','D']) && no5 && no7 && Q8==='A' && Q9==='A' && Q16==='A' && Q17==='A') return 5;
  if(Q15==='B' && Q3==='C' && no7 && no5 && Q8==='A' && Q9==='A' && Q16==='A') return 5;
  // 10节
  if(Q15==='A' && Q3==='A' && iss5bc && no7 && Q16==='A' && Q17==='A') return 10;
  if(Q15==='A' && Q3==='B' && iss5bc && Q16==='A' && Q17==='A') return 10;
  if(Q15==='C' && Q3==='C' && no7 && no5 && Q16==='A' && Q17==='A') return 10;
  if(Q15==='C' && Q3==='D' && no5 && iss7bc && Q16==='A' && Q17==='A') return 10;
  // 20节
  if(Q15==='C' && Q3==='A' && iss5bc && iss7bc && Q16==='A' && Q17==='A') return 20;
  if(Q15==='C' && Q3==='B' && iss5bc && iss7bc && Q16==='A' && Q17==='B') return 20;
  if(Q15==='D' && Q4==='A' && Q3==='C' && iss7bc && Q16==='B' && Q17==='A') return 20;
  if(Q15==='C' && Q3==='A' && iss5bc && iss7bc && Q16==='A' && Q17==='C') return 20;
  // 50节
  if(Q15==='D' && Q4==='B' && Q3==='A' && inArr(Q16,['B','C']) && Q17==='A') return 50;
  // 注：以下规则引用 Q10 包含 'D'，但新题 Q10 只有 A/B/C，该条件实际不会触发，保留以对齐原逻辑
  if(Q15==='D' && Q3==='B' && iss7bcd && hasProb(Q10,['D']) && Q16==='B' && Q17==='A') return 50;
  if(Q15==='D' && Q3==='A' && inArr(Q4,['B','C']) && Q16==='B' && Q17==='A') return 50;
  return null; // 兜底 = 10节
}
function computePackage(a){
  let base=determinePackage(a);
  let isDefault=false;
  let num = (base===null) ? 10 : base;
  if(base===null) isDefault=true;
  let voice=false, voiceAdd=0;
  if(a.Q2==='B' && inArr(a.Q2_1,['A','B','C'])){
    voice=true; voiceAdd = inArr(a.Q2_1,['A','B']) ? 2 : 1; num += voiceAdd;
  }
  return { num:num, isDefault:isDefault, voice:voice, voiceAdd:voiceAdd };
}

function parseBlocks(text){

    if(raw.indexOf('【')===0) return {type:'glabel',text:raw};

function filterVisible(qids){
  return qids.filter(function(qid){
    const q=QUESTIONS.find(x=>x.id===qid);
    if(q && q.cond && answers[q.cond.q]!==q.cond.is) return false;
    return true;
  });
}
function visibleQids(step){ return filterVisible(STEPS[step-1].qids); }
function renderQuestions(qids){
  const box=document.getElementById('questions'); box.innerHTML='';
  qids.forEach(function(qid){
    const q=QUESTIONS.find(x=>x.id===qid); if(!q) return;
    const card=document.createElement('div'); card.className='card';

    head.innerHTML='<span class="qno">'+(QUESTIONS.indexOf(q)+1)+'</span><span class="qtitle">'+q.title+'</span><span class="qtag">'+(q.type==='multi'?'多选':'单选')+'</span>';
    card.appendChild(head);
    const opts=document.createElement('div'); opts.className='opts';
    q.options.forEach(function(op){
      const el=document.createElement('div');

      el.className='opt'+(on?' on':'');
      el.textContent=op.text;
      el.onclick=function(){ tap(q,op.key); };

  } else pb.style.display='none';
  // 问题（支持分组）

      renderQuestions(filterVisible(g.qids));

  }

  document.getElementById('nextBtn').textContent = st.cta ? '生成学员方案' : '下一步';
  if(st.aiScript && loadAI().enabled && loadAI().apiKey) enhanceScript(st, currentStep);

function tap(q,key){
  if(q.type==='single'){
    answers[q.id]=(answers[q.id]===key)?'':key;
    if(q.id==='Q2' && key!=='B') answers.Q2_1='';
  } else {
    let arr=answers[q.id].slice();
    if(q.exclusiveKey && key===q.exclusiveKey){ arr=(arr.indexOf(key)>=0)?[]:[key]; }
    else { const i=arr.indexOf(key); if(i>=0) arr.splice(i,1); else arr.push(key); if(q.exclusiveKey){ const e=arr.indexOf(q.exclusiveKey); if(e>=0) arr.splice(e,1); } }
    answers[q.id]=arr;
  }
  renderStep();
}
function validateStep(){
  const st=STEPS[currentStep-1];
  const qids = st.qids || [];
  for(let i=0;i<qids.length;i++){
    const qid=qids[i]; const q=QUESTIONS.find(x=>x.id===qid);
    if(q.cond && answers[q.cond.q]!==q.cond.is) continue;
    const v=answers[qid];
    if(q.type==='multi'){ if(!v||v.length===0) return q; }
    else { if(!v) return q; }
  }
  return null;
}

// 图片生成（canvas 长图）—— 信纸质感 + 手书体 + 老师落款
function wrap(ctx,fontStr,text,maxWidth){
  ctx.font=fontStr; const chars=Array.from(text); const lines=[]; let cur='';
  for(let i=0;i<chars.length;i++){ const test=cur+chars[i]; if(ctx.measureText(test).width>maxWidth&&cur){ lines.push(cur); cur=chars[i]; } else cur=test; }
  if(cur) lines.push(cur); return lines.length?lines:[''];
}
function cleanEmoji(t){
  if(!t) return '';
  return t.replace(/^[\u{1F300}-\u{1F9FF}\u{2600}-\u{26FF}\u{2700}-\u{27BF}\u{2B50}\u{2B55}\u{FE0F}\s]+/gu,'').trim();
}
function makeImage(report){
  const dpr=window.devicePixelRatio||2;
  const cssW=Math.min(window.innerWidth-24,420);
  const pad=22, frame=14, inner=pad+frame;
  const meas=document.createElement('canvas').getContext('2d');
  const HAND='"STKaiti","Kaiti SC","KaiTi","楷体","Xingkai SC",cursive';
  const BODY='-apple-system,"PingFang SC","Microsoft YaHei",sans-serif';
  const C={ ink:'#3a3530', accent:'#b06a2c', green:'#5b8c3e', red:'#c0533b', muted:'#9a8e7e', frame:'#d8c8a8', line:'#e7dcc6' };
  const font=function(sz,bold,hand){ return (bold?'bold ':'')+sz+'px '+(hand?HAND:BODY); };
  const W=cssW-pad*2-frame*2;
  const blocks=parseBlocks(report.plainText);
  const L=[]; let y=inner+8;
  function push(st,h){ st.top=(st.top||0); st.h=h; y+=st.top; y+=h; L.push(st); }
  blocks.forEach(function(b){
    const t=b.text||'', ty=b.type;
    if(ty==='title'){ push({kind:'title',text:cleanEmoji(t),top:4},42); }
    else if(ty==='h2'){ push({kind:'h2',text:t,top:18},26); }
    else if(ty==='h3'){ push({kind:'h3',text:t,top:12},22); }
    else if(ty==='glabel'){ push({kind:'glabel',text:t,top:10},22); }
    else if(ty==='bullet'){ const ls=wrap(meas,font(14,false,false),t,W-18); push({kind:'bullet',lines:ls,top:4},ls.length*21); }
    else if(ty==='sub'){ const ls=wrap(meas,font(13,false,false),t,W-16); push({kind:'sub',lines:ls,top:3},ls.length*19); }
    else if(ty==='check'){ const ls=wrap(meas,font(14,false,false),cleanEmoji(t),W-20); push({kind:'check',lines:ls,top:6},ls.length*21); }
    else if(ty==='warn'){ const ls=wrap(meas,font(13.5,false,false),cleanEmoji(t),W-20); push({kind:'warn',lines:ls,top:7},ls.length*21); }
    else if(ty==='txt'){
      if(t.indexOf('（')===0){ const ls=wrap(meas,font(12.5,false,false),t,W); push({kind:'note',lines:ls,top:5},ls.length*18); }
      else { const ls=wrap(meas,font(14,false,false),t,W); push({kind:'txt',lines:ls,top:4},ls.length*21); }
    }
    else if(ty==='space'){ y+=8; }
  });
  const sigTop=18, sigH=46, dateStr=fmt(new Date());
  const cssH=Math.ceil(y+frame+pad+sigTop+sigH);
  const canvas=document.createElement('canvas'); canvas.width=cssW*dpr; canvas.height=cssH*dpr;
  const ctx=canvas.getContext('2d'); ctx.scale(dpr,dpr);
  const g=ctx.createLinearGradient(0,0,0,cssH); g.addColorStop(0,'#fdf9f0'); g.addColorStop(1,'#f7efe0');
  ctx.fillStyle=g; ctx.fillRect(0,0,cssW,cssH);
  ctx.strokeStyle=C.frame; ctx.lineWidth=1.5; ctx.strokeRect(frame,frame,cssW-frame*2,cssH-frame*2);
  ctx.strokeStyle=C.line; ctx.lineWidth=1; ctx.strokeRect(frame+5,frame+5,cssW-frame*2-10,cssH-frame*2-10);
  let dy=inner+8;
  L.forEach(function(st){
    dy+=st.top||0;
    if(st.kind==='title'){
      ctx.fillStyle=C.ink; ctx.font=font(22,true,true); ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillText(st.text, cssW/2, dy+st.h/2); ctx.textAlign='left';
    }
    else if(st.kind==='h2'){ ctx.fillStyle=C.ink; ctx.font=font(17,true,true); ctx.textBaseline='top'; ctx.fillText(st.text, inner, dy); }
    else if(st.kind==='h3'){ ctx.fillStyle=C.accent; ctx.font=font(15,true,true); ctx.textBaseline='top'; ctx.fillText(st.text, inner, dy); }
    else if(st.kind==='glabel'){ ctx.fillStyle=C.accent; ctx.font=font(15,true,true); ctx.textBaseline='top'; ctx.fillText(st.text, inner, dy); }
    else if(st.kind==='bullet'){ ctx.fillStyle=C.accent; ctx.font=font(13,true,false); ctx.textBaseline='top'; ctx.fillText('·', inner+4, dy+2);
      ctx.fillStyle=C.ink; ctx.font=font(14,false,false); st.lines.forEach(function(ln,i){ ctx.fillText(ln, inner+18, dy+i*21); }); }
    else if(st.kind==='sub'){ ctx.fillStyle=C.muted; ctx.font=font(13,false,false); ctx.textBaseline='top'; st.lines.forEach(function(ln,i){ ctx.fillText((i===0?'– ':'  ')+ln, inner+16, dy+i*19); }); }
    else if(st.kind==='check'){ ctx.fillStyle=C.green; ctx.font=font(13,true,false); ctx.textBaseline='top'; ctx.fillText('·', inner+4, dy+1);
      ctx.fillStyle=C.ink; ctx.font=font(14,false,false); st.lines.forEach(function(ln,i){ ctx.fillText(ln, inner+20, dy+i*21); }); }
    else if(st.kind==='warn'){ ctx.fillStyle=C.red; ctx.font=font(13.5,false,false); ctx.textBaseline='top'; st.lines.forEach(function(ln,i){ ctx.fillText((i===0?'小提醒：':'')+ln, inner+2, dy+i*21); }); }
    else if(st.kind==='note'){ ctx.fillStyle=C.muted; ctx.font=font(12.5,false,false); ctx.textBaseline='top'; st.lines.forEach(function(ln,i){ ctx.fillText(ln, inner, dy+i*18); }); }
    else if(st.kind==='txt'){ ctx.fillStyle=C.ink; ctx.font=font(14,false,false); ctx.textBaseline='top'; st.lines.forEach(function(ln,i){ ctx.fillText(ln, inner, dy+i*21); }); }
    dy+=st.h||0;
  });
  // 手绘小笑脸涂鸦（置于原落款签名位置）
  (function drawSmiley(){
    const cx=cssW-inner-26, cy=dy+sigTop+14, r=11;
    ctx.save();
    ctx.strokeStyle='#7a6d5c'; ctx.fillStyle='#7a6d5c';
    ctx.lineWidth=1.3; ctx.lineCap='round'; ctx.lineJoin='round';
    // 脸
    ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI*2); ctx.stroke();
    // 左眼
    ctx.beginPath(); ctx.arc(cx-r*0.36, cy-r*0.28, r*0.13, 0, Math.PI*2); ctx.fill();
    // 右眼
    ctx.beginPath(); ctx.arc(cx+r*0.34, cy-r*0.28, r*0.13, 0, Math.PI*2); ctx.fill();
    // 嘴巴
    ctx.beginPath(); ctx.arc(cx, cy-r*0.05, r*0.6, 0.18*Math.PI, 0.82*Math.PI); ctx.stroke();
    ctx.restore();
  })();
  ctx.fillStyle=C.muted; ctx.font=font(12,false,false); ctx.textAlign='left';
  ctx.fillText(dateStr, inner, dy+sigTop+30);
  ctx.textAlign='left';
  // 全图平铺水印（防盗用）
  (function drawWatermark(){
    const text='蘑菇老师  vx:-GDxxxxx';
    ctx.save();
    ctx.globalAlpha=0.10;
    ctx.fillStyle='#8a7c66';
    ctx.font='bold 15px '+BODY;
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.translate(cssW/2, cssH/2);
    ctx.rotate(-Math.PI/9);
    const stepX=180, stepY=82, diag=Math.ceil(Math.sqrt(cssW*cssW+cssH*cssH));
    for(let y=-diag; y<diag; y+=stepY){
      for(let x=-diag; x<diag; x+=stepX){
        ctx.fillText(text, x, y);
      }
    }
    ctx.restore();
  })();
  const url=canvas.toDataURL('image/png');
  document.getElementById('imgEl').src=url;
  document.getElementById('imgDown').onclick=function(){ const a=document.createElement('a'); a.href=url; a.download='声乐课时规划.png'; a.click(); };
  document.getElementById('imgMask').classList.add('show');
}

  const baseURL=(cfg.baseURL||'').replace(/\/$/,'');
  const model=cfg.model||'deepseek-ai/DeepSeek-V3';
  const sys='你是资深声乐老师“蘑菇老师”，正在为试听课后的学生写一份个人化学习建议。用第一人称“我”书写，语气真诚自然。全程禁止出现“AI”“智能”“自动生成”“算法”“模型”“系统推荐”等字眼；结尾禁止出现任何署名、落款、日期、祝福签名的文字（如“蘑菇老师 手书”“2023年X月X日”“祝好”等）。所有短板都用正面、鼓励的训练方向来表达，不做负面诊断。';
  const stageHead = (total<=5)
    ? '### 阶段一（第1-3节）：气息与发声基础\n- 核心目标：...\n- 主要内容：...\n- 课后练习：...\n### 阶段二（第4-'+total+'节）：声音连接与统一\n- 核心目标：...\n- 主要内容：...\n- 课后练习：...\n'
    : '### 阶段一（第1-4节）：气息与发声基础\n- 核心目标：...\n- 主要内容：...\n- 课后练习：...\n### 阶段二（第5-8节）：声音连接与统一\n- 核心目标：...\n- 主要内容：...\n- 课后练习：...\n### 阶段三（第9-'+total+'节）：歌曲处理与表达\n- 核心目标：...\n- 主要内容：...\n- 课后练习：...\n';
  const voiceText = voiceAdd ? '\n\n【变声期特别说明】\n该学员处于变声期，声带处于快速发育阶段。训练中会特别注重声带保护，以放松训练和轻声练习为主，不追求音量和极限音域。变声期是嗓音发育的关键阶段，需要循序渐进，不可急于求成。' : '';
  const user='学生试听课评估：\n'+JSON.stringify(readableAnswers(ans),null,2)+'\n\n已确定总课时：'+total+'节（每节'+lessonMinutes(ans)+'分钟）。\n\n请严格按以下结构输出 Markdown（## 为一级标题，### 为阶段标题，- 为列表项，✅ 为达成项），不要输出任何额外说明或代码块标记：\n\n'+
    '## 一、当前状态\n（2-3 句正面描述，围绕训练方向，不诊断）\n\n'+
    '## 二、本阶段重点解决的问题\n（只写 2-3 个核心问题，用“优先关注/本阶段重点”限定；其余用“我会在后续课程里逐步带过”带过）\n\n'+
    '## 三、阶段规划（共'+total+'节，每节'+lessonMinutes(ans)+'分钟）\n'+stageHead+
    '## 四、推荐曲目\n【入门曲目】\n- 两首入门曲 — 适用于巩固气息与中声区稳定\n【进阶曲目】\n- 两首进阶曲 — 适用于换声区与表现力训练\n\n'+
    '## 五、课后练习总建议\n\n## 六、上课方式\n（腾讯会议一对一线上授课，每节'+lessonMinutes(ans)+'分钟）\n\n## 七、预期效果\n✅ 稳定运用气息支撑发声\n✅ 高音自然顺畅\n✅ 完整演唱一首喜欢的歌曲，有自己的表达'+voiceText+'\n\n注意：结尾不要添加任何落款、署名、日期（如“蘑菇老师 手书”“2023年X月X日”等），也不要写多余祝福语。';
  const body={ model:model, messages:[{role:'system',content:sys},{role:'user',content:user}], temperature:0.4 };
  const resp=await fetch(baseURL+'/chat/completions', {
    method:'POST',
    headers:{ 'Content-Type':'application/json', 'Authorization':'Bearer '+cfg.apiKey },
    body:JSON.stringify(body)
  });
  if(!resp.ok) throw new Error('HTTP '+resp.status);
  const data=await resp.json();
  const content=(data.choices&&data.choices[0]&&data.choices[0].message)?data.choices[0].message.content:'';
  return content ? content.trim() : null;
}
function applyAI(ans, total, aiText){
  const base=buildReport(ans, { total:total });
  // 兜底清理：删除 AI 偶尔自动加上的落款、署名、占位日期
  let clean=aiText.replace(/^[-—–\s]*蘑菇老师\s*(?:手书|敬上)?[:：]?\s*$/gim,'');
  clean=clean.replace(/\d{4}年\s*[X\d]{1,2}月\s*[X\d]{1,2}日/g,'');
  clean=clean.replace(/^(?:此致|敬礼|祝好|顺祝|签名|落款)[:：]?.*$/gim,'');
  clean=clean.replace(/\n{3,}/g,'\n\n').trim();
  return { total:total, pkgLabel:total+'节', isDefault:base.isDefault, voice:base.voice, voiceAdd:base.voiceAdd, plainText:clean, aiEnhanced:true };
}

// 用 AI 生成某一步的“老师话术”（开启 AI 且填了密钥时；否则用模板兜底）
async function callAIScript(ans, st){
  const cfg=loadAI(); if(!cfg.enabled || !cfg.apiKey) return null;
  const baseURL=(cfg.baseURL||'').replace(/\/$/,''); const model=cfg.model||'deepseek-ai/DeepSeek-V3';
  const sys='你是资深声乐老师“蘑菇老师”，正在给学生做一对一线下/线上试听课。用第一人称“我”，语气真诚自然，像当面跟学生说话。全程禁止出现“AI”“智能”“自动生成”“算法”“模型”“系统推荐”等字眼，禁止出现价格和优惠。';
  const name=st.name||'';
  let goal;
  if(name.indexOf('体验')>=0) goal='结合学生最想解决的问题和诊断，用一两句话先点出“我听到你的XX，这主要是XX方面的习惯问题”，再给出带练引导。口语、真诚。';
  else if(name.indexOf('价值')>=0) goal='结合下方系统算出的课时包、每周频率和阶段周期，用口语化方式说明为什么这样安排，并自然引导确定排课，不出现价格。';
  else goal='结合系统算出的课时包和频率，给出促成话术：自然提及建议从多少节开始、每周频率、约几周看到变化，并引导确定排课时间。';
  let user='学生试听课评估：\n'+JSON.stringify(readableAnswers(ans),null,2)+'\n\n当前步骤：'+name;
  if(name.indexOf('体验')<0){
    const pkg=computePackage(ans), freq=recommendFreq(ans), weeks=Math.ceil(stageOneCount(pkg.num)/freq.perWeek);
    user+='\n系统已确定：建议课时 '+pkg.num+' 节，每周频率 '+freq.text+'，约 '+weeks+' 周完成第一阶段训练。';
  }
  user+='\n\n请只输出该步骤老师要对学生说的 2-4 句话术，每行一句，直接给话术文本，不要标题、不要解释、不要代码块标记。';
  const body={ model:model, messages:[{role:'system',content:sys},{role:'user',content:user}], temperature:0.5 };
  const resp=await fetch(baseURL+'/chat/completions', {
    method:'POST',
    headers:{ 'Content-Type':'application/json', 'Authorization':'Bearer '+cfg.apiKey },
    body:JSON.stringify(body)
  });
  if(!resp.ok) throw new Error('HTTP '+resp.status);
  const data=await resp.json();
  const content=(data.choices&&data.choices[0]&&data.choices[0].message)?data.choices[0].message.content:'';
  if(!content) return null;
  return content.split('\n').map(function(s){ return s.replace(/^[\-\*\d\.、\s]+/,'').trim(); }).filter(function(s){ return s.length>0; });
}
function enhanceScript(st, stepAt){
  callAIScript(answers, st).then(function(lines){
    if(currentStep!==stepAt) return;
    const sb=document.getElementById('scriptBox'); if(!sb || !lines || !lines.length) return;
    sb.innerHTML='';
    lines.forEach(function(t){ const d=document.createElement('div'); d.className='script'; d.textContent=t; sb.appendChild(d); });
  }).catch(function(){});
}

async function generate(){
  const ruleReport=buildReport(answers);
  let finalReport=ruleReport;
  const cfg=loadAI();
  if(cfg.enabled && cfg.apiKey){
    toast('正在生成更贴合的方案…');
    try{
      const ai=await callAI(answers, ruleReport.total, ruleReport.voiceAdd);
      if(ai && ai.length>20){ finalReport=applyAI(answers, ruleReport.total, ai); }
    }catch(e){ toast('详细方案生成失败，已用规则方案'); }
  }
  current={ answers:JSON.parse(JSON.stringify(answers)), report:finalReport };
  showReport(finalReport); saveHistory(current);
  toast('方案已生成，请复制下方内容发给学员');
}

// 初始化
renderStep();
